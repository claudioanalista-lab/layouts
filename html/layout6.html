<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alinhamentos Flexbox</title>
  <link rel="stylesheet" href="layout6.css">
</head>
<body>
  <div class="container">
    <!-- Linha 1: Alinhado à direita (flex-end) -->
    <div class="row row-1">
      <div class="circle circle-purple"></div>
      <div class="circle circle-purple"></div>
      <div class="circle circle-purple"></div>
      <div class="circle circle-purple"></div>
    </div>

    <!-- Linha 2: Alinhado à direita (flex-end) -->
    <div class="row row-2">
      <div class="circle circle-green"></div>
      <div class="circle circle-green"></div>
      <div class="circle circle-green"></div>
      <div class="circle circle-green"></div>
    </div>

    <!-- Linha 3: Centralizado (center) -->
    <div class="row row-3">
      <div class="circle circle-red"></div>
      <div class="circle circle-red"></div>
      <div class="circle circle-red"></div>
      <div class="circle circle-red"></div>
    </div>

    <!-- Linha 4: Espaçamento nas pontas (space-between) -->
    <div class="row row-4">
      <div class="circle circle-yellow"></div>
      <div class="circle circle-yellow"></div>
      <div class="circle circle-yellow"></div>
      <div class="circle circle-yellow"></div>
    </div>

    <!-- Linha 5: Espaçamento uniforme com margens nas pontas (space-around) -->
    <div class="row row-5">
      <div class="circle circle-blue"></div>
      <div class="circle circle-blue"></div>
      <div class="circle circle-blue"></div>
      <div class="circle circle-blue"></div>
    </div>
  </div>
</body>
</html>
